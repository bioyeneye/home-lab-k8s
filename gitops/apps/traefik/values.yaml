# Traefik v3 (internal ingress controller)
crds:
  enabled: true
  install: true

deployment:
  enabled: true
  kind: Deployment
  replicas: 2

podDisruptionBudget:
  enabled: true
  minAvailable: 1

additionalArguments:
  - "--ping=true"
  - "--ping.entrypoint=web"

api:
  dashboard: true
  insecure: false

# Expose the dashboard using the built-in IngressRoute
ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
      - web
    middlewares:
      - name: dashboard-auth
        namespace: traefik

# LoadBalancer service using MetalLB
service:
  type: LoadBalancer
  annotations:
    metallb.universe.tf/address-pool: default-pool
    metallb.universe.tf/loadBalancerIPs: 172.16.0.103

# Entrypoints - Use high ports for container, expose standard ports via service
ports:
  traefik:
    port: 9000
    expose:
      default: false
    protocol: TCP

  web:
    port: 8000              # Container port (unprivileged)
    expose:
      default: true
    exposedPort: 80         # Service port (what external world sees)
    protocol: TCP

  websecure:
    port: 8443              # Container port (unprivileged)
    expose:
      default: true
    exposedPort: 443        # Service port (what external world sees)
    protocol: TCP
    tls:
      enabled: false        # TLS handled by external Traefik VM

# Set Traefik as the default Ingress controller
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

# Providers
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true

# Logging
logs:
  general:
    level: INFO
  access:
    enabled: true