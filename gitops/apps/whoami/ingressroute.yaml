apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami
  namespace: whoami
  labels:
    app: whoami
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`k8s-whoami.buildplatform.net`) || PathPrefix(`/whoami`)
      kind: Rule
      services:
        - name: whoami
          port: 80

---
# Alternative route with rate limiting (for testing)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami-ratelimited
  namespace: whoami
  labels:
    app: whoami
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # Rate-limited endpoint at /whoami-rl
    - match: PathPrefix(`/whoami-rl`)
      kind: Rule
      services:
        - name: whoami
          port: 80
      middlewares:
        - name: strip-whoami-rl
          namespace: whoami

---
# Middleware to strip the /whoami-rl prefix
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-whoami-rl
  namespace: whoami
spec:
  stripPrefix:
    prefixes:
      - /whoami-rl